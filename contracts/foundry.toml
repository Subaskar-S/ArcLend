[profile.default]
src = "contracts"
out = "artifacts-foundry"
libs = ["/Volumes/Work/Blockchain/ArcLend/contracts/node_modules", "lib"]
test = "test"
cache_path = "cache-foundry"

# Only compile/test .t.sol files — Hardhat handles .test.ts
# Match Hardhat solidity settings exactly
solc_version = "0.8.21"
via_ir = true
optimizer = true
optimizer_runs = 200

# Foundry remappings — resolve OpenZeppelin from node_modules
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "forge-std/=lib/forge-std/src/",
]

# Fuzz configuration
[profile.default.fuzz]
runs = 1000
max_test_rejects = 65536

[profile.default.invariant]
runs = 500
depth = 20
